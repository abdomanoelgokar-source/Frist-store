<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Philo Fries | فيلو فرايز</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #f9f9f9;
            --text-color: #333;
            --card-bg: #ffffff;
            --primary-color: #ffcc00;
            --secondary-color: #222;
            --shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #ffffff;
            --card-bg: #1e1e1e;
            --shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: 0.3s;
        }

        /* صفحة الواجهة */
        #landing-page {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            color: #fff;
            text-align: center;
        }

        #main-logo {
            width: 170px; height: 170px;
            border-radius: 50%; object-fit: cover;
            border: 5px solid var(--primary-color);
            margin-bottom: 20px;
        }

        h1 { font-size: 3.5rem; color: var(--primary-color); text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }

        .btn-enter {
            padding: 15px 45px;
            background-color: var(--primary-color);
            color: #000;
            border: none; border-radius: 50px;
            font-size: 1.2rem; cursor: pointer;
            font-weight: bold; transition: 0.3s;
        }

        /* أزرار التحكم العلوية */
        .top-controls {
            position: fixed; top: 20px; left: 20px;
            display: flex; gap: 10px; z-index: 2000;
        }

        .icon-btn {
            background: rgba(0,0,0,0.5); color: white;
            border: none; width: 45px; height: 45px;
            border-radius: 50%; cursor: pointer;
            font-size: 1.2rem; display: flex;
            justify-content: center; align-items: center;
        }

        /* القائمة الرئيسية للمسؤول */
        #admin-main-menu {
            display: none; position: fixed; top: 80px; left: 20px;
            background: var(--card-bg); padding: 15px;
            border-radius: 15px; box-shadow: var(--shadow); z-index: 3000;
        }
        .admin-menu-btn {
            display: block; width: 100%; padding: 10px; margin: 5px 0;
            background: var(--secondary-color); color: white; border: none;
            border-radius: 8px; cursor: pointer; text-align: right;
        }

        /* لوحات التعديل */
        .admin-panel {
            display: none; position: fixed; top: 80px; left: 220px;
            background: var(--card-bg); padding: 20px;
            border-radius: 15px; box-shadow: var(--shadow); z-index: 3001;
            width: 250px; border: 2px solid var(--primary-color);
        }

        /* صفحة المنتجات */
        #products-page { display: none; padding: 40px 20px; }
        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px; max-width: 1200px; margin: 0 auto;
        }
        .product-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 20px; box-shadow: var(--shadow);
            text-align: center;
        }
        .product-card img { width: 100%; height: 200px; object-fit: cover; border-radius: 15px; }

        .edit-mode-indicator {
            display: none; background: #ff4444; color: white;
            padding: 5px; border-radius: 5px; margin-bottom: 10px; font-size: 0.8rem;
        }

        /* المدخلات */
        input[type="file"], input[type="text"], input[type="number"] {
            width: 100%; margin: 10px 0; padding: 8px; border-radius: 5px; border: 1px solid #ccc;
        }

        .floating-btns {
            position: fixed; bottom: 30px; right: 30px;
            display: flex; flex-direction: column; gap: 15px; z-index: 1000;
        }
        .float-btn {
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            color: white; font-size: 1.5rem; text-decoration: none;
        }
        .support-btn { background: #007bff; }
        .cart-btn { background: var(--primary-color); color: #000; }
    </style>
</head>
<body>

    <!-- أزرار التحكم العلوية -->
    <div class="top-controls">
        <button class="icon-btn" onclick="toggleAdminMenu()" title="لوحة التحكم">🔑</button>
        <button class="icon-btn" onclick="toggleDarkMode()">🌙</button>
    </div>

    <!-- قائمة المسؤول الرئيسية -->
    <div id="admin-main-menu">
        <h4 style="margin:0 0 10px 0; text-align:center">لوحة التحكم</h4>
        <button class="admin-menu-btn" onclick="openLandingEditor()">🖼️ تعديل صور الواجهة</button>
        <button class="admin-menu-btn" onclick="toggleProductEditor()">🍔 تعديل المنيو والمنتجات</button>
        <button class="admin-menu-btn" onclick="location.reload()" style="background:#444">🚪 خروج وحفظ</button>
    </div>

    <!-- لوحة تعديل الواجهة (منفصلة) -->
    <div id="landing-editor" class="admin-panel">
        <h4 style="margin-top:0">تعديل صور الواجهة (JPEG)</h4>
        <label style="font-size:0.8rem">صورة الخلفية الرئيسية:</label>
        <input type="file" accept=".jpg, .jpeg" onchange="updateLandingImg('bg', this)">
        <label style="font-size:0.8rem">صورة اللوجو الدائري:</label>
        <input type="file" accept=".jpg, .jpeg" onchange="updateLandingImg('logo', this)">
        <button onclick="closeLandingEditor()" style="width:100%; background:var(--primary-color); border:none; padding:8px; border-radius:5px; cursor:pointer">تم</button>
    </div>

    <!-- الواجهة الرئيسية -->
    <section id="landing-page">
        <img src="https://via.placeholder.com/200?text=Logo" id="main-logo">
        <h1>PHILO FRIES</h1>
        <p>البطاطس المقرمشة كما يجب أن تكون</p><br>
        <button class="btn-enter" onclick="showProducts()">عرض قائمة الطعام</button>
    </section>

    <!-- صفحة المنتجات -->
    <section id="products-page">
        <div style="text-align: center; margin-bottom: 30px;">
            <button onclick="goBack()" style="float: right; background:none; border:none; cursor:pointer; color:var(--text-color)"><i class="fas fa-arrow-right"></i> رجوع</button>
            <h2 id="page-title">قائمتنا اللذيذة</h2>
            <div id="edit-notice" class="edit-mode-indicator">وضع التعديل مفعل: يمكنك تغيير الصور والبيانات من الكروت بالأسفل</div>
            <hr style="width: 50px; border: 2px solid var(--primary-color);">
        </div>
        <div class="products-grid" id="product-container"></div>
    </section>

    <!-- الأزرار العائمة -->
    <div class="floating-btns">
        <a href="https://wa.me/201126511633" class="float-btn support-btn"><i class="fas fa-headset"></i></a>
        <div class="float-btn cart-btn" onclick="alert('السلة ستفتح قريباً')"><i class="fas fa-shopping-basket"></i></div>
    </div>

    <script>
        let products = JSON.parse(localStorage.getItem('philo_products')) || [
            { id: 0, name: "وجبة فيلو كلاسيك", price: 55, image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=400" },
            { id: 1, name: "فيلو تشيز فرايز", price: 70, image: "https://images.unsplash.com/photo-1585109649139-366815a0d713?w=400" }
        ];

        let isProductEditMode = false;

        window.onload = function() {
            if (localStorage.getItem('dark_mode') === 'true') toggleDarkMode();
            
            const sBG = localStorage.getItem('philo_bg');
            if (sBG) document.getElementById('landing-page').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(${sBG})`;
            
            const sLogo = localStorage.getItem('philo_logo');
            if (sLogo) document.getElementById('main-logo').src = sLogo;

            renderProducts();
        };

        // --- التحكم في القوائم ---
        function toggleAdminMenu() {
            let p = prompt("كلمة مرور المسؤول:");
            if (p === "2544") {
                document.getElementById('admin-main-menu').style.display = 'block';
            }
        }

        function openLandingEditor() {
            document.getElementById('landing-editor').style.display = 'block';
        }

        function closeLandingEditor() {
            document.getElementById('landing-editor').style.display = 'none';
        }

        function toggleProductEditor() {
            isProductEditMode = !isProductEditMode;
            document.getElementById('edit-notice').style.display = isProductEditMode ? 'block' : 'none';
            // عند فتح تعديل المنتجات.. نغلق لوحة الواجهة تلقائياً لعدم التداخل
            closeLandingEditor();
            renderProducts();
            if(isProductEditMode) {
                showProducts(); // ننتقل لصفحة المنتجات لنعدلها
                alert("يمكنك الآن تعديل صور وبيانات المنتجات مباشرة من الكروت");
            }
        }

        // --- تعديل الواجهة (JPEG) ---
        function updateLandingImg(type, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    if (type === 'bg') {
                        document.getElementById('landing-page').style.backgroundImage = `linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url(${e.target.result})`;
                        localStorage.setItem('philo_bg', e.target.result);
                    } else {
                        document.getElementById('main-logo').src = e.target.result;
                        localStorage.setItem('philo_logo', e.target.result);
                    }
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // --- تعديل المنتجات (JPEG) ---
        function renderProducts() {
            const container = document.getElementById('product-container');
            container.innerHTML = '';
            products.forEach((p, i) => {
                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.image}" id="prod-img-${i}">
                        <h3>${p.name}</h3>
                        <p style="color:var(--primary-color); font-weight:bold">${p.price} جنيه</p>
                        
                        ${isProductEditMode ? `
                            <div style="background:rgba(0,0,0,0.05); padding:10px; border-radius:10px; margin-top:10px">
                                <label style="font-size:11px">صورة المنتج (JPEG):</label>
                                <input type="file" accept=".jpg, .jpeg" onchange="changeProdImg(${i}, this)">
                                <input type="text" value="${p.name}" onchange="updateProdData(${i}, 'name', this.value)" placeholder="الاسم">
                                <input type="number" value="${p.price}" onchange="updateProdData(${i}, 'price', this.value)" placeholder="السعر">
                                <button onclick="saveAllProds()" style="background:green; color:white; border:none; padding:5px; width:100%; border-radius:5px; cursor:pointer">حفظ المنتج</button>
                            </div>
                        ` : `
                            <button class="btn-enter" style="padding:10px 20px; font-size:0.9rem" onclick="sendOrder('${p.name}')">طلب الآن</button>
                        `}
                    </div>
                `;
            });
        }

        function changeProdImg(index, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    products[index].image = e.target.result;
                    document.getElementById(`prod-img-${index}`).src = e.target.result;
                    saveAllProds();
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function updateProdData(index, field, val) {
            products[index][field] = val;
        }

        function saveAllProds() {
            localStorage.setItem('philo_products', JSON.stringify(products));
        }

        // --- وظائف عامة ---
        function showProducts() {
            document.getElementById('landing-page').style.display = 'none';
            document.getElementById('products-page').style.display = 'block';
        }

        function goBack() {
            document.getElementById('products-page').style.display = 'none';
            document.getElementById('landing-page').style.display = 'flex';
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            localStorage.setItem('dark_mode', isDark);
        }

        function sendOrder(name) {
            window.open(`https://wa.me/201126511633?text=أريد طلب: ${name}`, '_blank');
        }
    </script>

</body>
            </html>
